# XcodeGen spec — the source of truth for FunctionAlps.xcodeproj.
# Regenerate after ANY change here or after adding/removing Swift files:
#   cd FunctionAlps && xcodegen generate
# The generated .xcodeproj is git-ignored on purpose (see docs/TOOLING.md §3).
name: FunctionAlps
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Staging: release
  Release: release

configFiles:
  Debug: Config/Development.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Production.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM comes from Config/Local.xcconfig (git-ignored) via Base.xcconfig.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    STRING_CATALOG_GENERATE_SYMBOLS: NO

targets:
  FunctionAlps:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: FunctionAlps
        CFBundleName: FunctionAlps
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.functionalps.patient
            CFBundleURLSchemes: [functionalps]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: FunctionAlps uses the camera to photograph your meals so they can be analysed.
        UIAppFonts:
          - DMSerifDisplay_400Regular.ttf
          - DMSerifDisplay_400Regular_Italic.ttf
          - DMSans_400Regular.ttf
          - DMSans_500Medium.ttf
          - DMSans_600SemiBold.ttf
          - DMSans_700Bold.ttf
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # Environment values injected from Config/*.xcconfig at build time.
        FA_ENVIRONMENT_NAME: $(FA_ENVIRONMENT_NAME)
        FA_API_BASE_URL: $(FA_API_BASE_URL)
        FA_SUPABASE_URL: $(FA_SUPABASE_URL)
        FA_SUPABASE_PUBLISHABLE_KEY: $(FA_SUPABASE_PUBLISHABLE_KEY)
    entitlements:
      path: Sources/Resources/FunctionAlps.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FA_BUNDLE_ID)
        PRODUCT_NAME: FunctionAlps
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    scheme:
      testTargets:
        - FunctionAlpsTests
      gatherCoverageData: true
      configVariants: []

  FunctionAlpsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FunctionAlps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
