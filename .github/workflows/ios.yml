name: iOS

# The Mac we do not own. macOS runners cost 10x Linux minutes on the free tier
# (2,000 min/month → ~200 macOS minutes): keep pushes deliberate.
on:
  push:
    branches: ["main", "claude/**", "feat/**", "release/testflight"]
    # No path filter: with one, GitHub skips a push whose diff is empty (e.g. a new
    # branch identical to main), which silently swallowed the release/testflight trigger.
    # Pushing to the `release/testflight` branch archives + uploads to TestFlight
    # (agent-drivable without the Run-workflow button; tags are blocked by the agent's git proxy).
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Archive and upload to TestFlight (needs signing secrets)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: FunctionAlps

jobs:
  build-and-test:
    name: Build + unit tests (simulator)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          printf 'DEVELOPMENT_TEAM = %s\n' "${APPLE_TEAM_ID:-}" > Config/Local.xcconfig
          xcodegen generate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available | grep -i iphone | head -20
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone 1[6-9][^(]*' | head -1 | sed 's/ *$//')
          echo "name=${NAME:-iPhone 16}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${NAME:-iPhone 16}"

      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project FunctionAlps.xcodeproj \
            -scheme FunctionAlps \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation \
            | tee build/xcodebuild-build.log | grep -E "error:|warning: unre|BUILD|Compiling|\*\*" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild-build.log

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FunctionAlps.xcodeproj \
            -scheme FunctionAlps \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation \
            | tee build/xcodebuild-test.log | grep -E "error:|Test Suite|Test Case.*(passed|failed)|✔|✘|TEST" || true
          grep -qE "TEST SUCCEEDED|\*\* TEST SUCCEEDED \*\*" build/xcodebuild-test.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            FunctionAlps/build/*.log
            FunctionAlps/build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  testflight:
    name: Archive + TestFlight
    if: (github.event_name == 'workflow_dispatch' && inputs.testflight) || github.ref == 'refs/heads/release/testflight'
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          gem install bundler
          bundle install

      - name: Generate project
        run: |
          printf 'DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID" > Config/Local.xcconfig
          xcodegen generate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build, sign and upload
        run: bundle exec fastlane beta
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
