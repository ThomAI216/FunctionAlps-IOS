name: Screenshots

# The members-showcase screenshots: the Debug app in its showcase mode (sample member "Marie", no network —
# Sources/Core/Showcase), one launch per screen on an iPhone Pro simulator, light mode, English, 9:41 status bar.
# macOS minutes are scarce: this runs only when a pushed commit message contains "[screens]", or by hand.
# The Foundation Track set (every screen of the 14 days, on the real track content; Scripts/track_shots.tsv) runs
# when the message contains "[track-screens]", or by hand with set = track.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      set:
        description: "showcase (the members showcase), checkin (only the daily check-in) or track (the Foundation Track, every screen)"
        default: showcase

# Queue, never cancel: a later push without "[screens]" also starts this workflow (its job is skipped), and
# cancelling would kill the shoot already running.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: FunctionAlps

jobs:
  shoot:
    name: Shoot the showcase screens
    if: (github.event_name == 'workflow_dispatch' && inputs.set != 'track') || contains(github.event.head_commit.message, '[screens]') || contains(github.event.head_commit.message, '[checkin-screens]')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          printf 'DEVELOPMENT_TEAM = \n' > Config/Local.xcconfig
          xcodegen generate

      - name: Pick an iPhone Pro simulator
        id: sim
        run: |
          xcrun simctl list devices available | grep -i "iphone" | head -30
          LINE=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(|iPhone 17 Pro \(|iPhone 15 Pro \(" | head -1)
          UDID=$(echo "$LINE" | grep -oE '[0-9A-F-]{36}')
          NAME=$(echo "$LINE" | sed -E 's/^ *//; s/ \(.*//')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $NAME ($UDID)"

      - name: Build (Debug, simulator)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project FunctionAlps.xcodeproj -scheme FunctionAlps -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -skipMacroValidation \
            | tee build/build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build/build.log

      - name: Boot and dress the simulator
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$UDID" "$APP"

      - name: Shoot
        env:
          # "[checkin-screens]" in the message (or set = checkin by hand): only the daily check-in set, a few minutes.
          ONLY_CHECKIN: ${{ (contains(github.event.head_commit.message, '[checkin-screens]') || inputs.set == 'checkin') && '1' || '0' }}
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          BUNDLE=com.functionalps.patient
          # The screens are "in the morning": pick the whole-hour zone where it is 9 o'clock now.
          H=$(date -u +%H); N=$(( (9 - 10#$H + 24) % 24 ))
          if [ "$N" -le 14 ]; then TZONE="Etc/GMT-$N"; else TZONE="Etc/GMT+$(( 24 - N ))"; fi
          echo "Time zone for the app: $TZONE"
          mkdir -p shots
          shoot() {
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            SIMCTL_CHILD_TZ="$TZONE" xcrun simctl launch "$UDID" "$BUNDLE" \
              -FAShowcase "$2" -AppleLanguages "(${LANG_CODE:-en})" -AppleLocale "${LOCALE_CODE:-en_US}"
            sleep "${3:-9}"
            xcrun simctl io "$UDID" screenshot --type=png "shots/$1.png"
            echo "shot $1"
          }
          shootfr() { LANG_CODE=fr LOCALE_CODE=fr_CH shoot "$@"; }
          # The daily functional check-in (2026-11-10): Home's glass, last night on the dial and from a ring, the
          # sliders, the stool card, the Bristol chart, the red-flag card with the voice note.
          shoot 01-today today 12
          shoot 30-checkin-sleep checkin-sleep 10
          shoot 30b-checkin-sleep-drag checkin-sleep-drag 10
          shoot 31-checkin-wearable checkin-wearable 10
          shoot 02-checkin checkin
          shoot 32-checkin-stool checkin-stool 11
          shoot 33-bristol-chart bristol-chart 13
          shoot 34-checkin-note checkin-note 11
          shootfr 30-checkin-sleep-fr checkin-sleep 10
          shoot 35-bon-appetit bon-appetit 10
          shootfr 35-bon-appetit-fr bon-appetit 10
          # My health plan (2026-11-10): objective + approach, goals + journey, supplements + tests + review.
          shoot 07-care-plan careplan 12
          shoot 07c-care-plan-middle careplan-middle 12
          shoot 07d-care-plan-bottom careplan-bottom 12
          # Trends, reworked (2026-11-10, owner-validated mockup v2): the page from its top, middle and bottom, the Energy
          # row opened in place, then the pages behind it — Sleep, Digestion, a device (Oura) and the shared patterns.
          shoot 40-trends trends 14
          shoot 41-trends-middle trends-middle 14
          shoot 42-trends-bottom trends-bottom 14
          shoot 43-trends-energy-open trends-energy-open 14
          shoot 44-trends-sleep trends-sleep 12
          shoot 45-trends-digestion trends-digestion 12
          shoot 46-trends-device trends-device 12
          shoot 47-trends-patterns trends-patterns 12
          if [ "$ONLY_CHECKIN" = "1" ]; then ls -la shots; exit 0; fi
          shoot 13-onboarding onboarding 10
          shoot 01-today today 12
          shoot 01b-today-bottom today-bottom 14
          shoot 01c-profile profile 12
          shoot 02-checkin checkin
          shoot 02b-checkin-mood checkin-mood
          shoot 03-checkin-done checkin-done 12
          shoot 04-meal-log meal 12
          shoot 05-food-day food 12
          shoot 06-trends trends 12
          shoot 06b-scores scores
          shoot 07-care-plan careplan
          shoot 07b-action-card action 10
          shoot 08-library library 14
          shoot 09-symptoms symptoms
          # The new Library and the habit screens (Foundation Track v2, 2026-11-10).
          shoot 30-library-home library 14
          shoot 31-library-locked library-locked 12
          shoot 32-library-search library-search 12
          shoot 33-library-read library-read 12
          shoot 34-library-watch library-watch 12
          shoot 35-habits habits 12
          shoot 36-habit-open habit-open 12
          shoot 37-habit-page habit-page 12
          shoot 38-habit-first habit-first 12
          shoot 11-article article 10
          # The practice's answer with resources, and the mini track it points to (2026-11-05).
          shoot 12-messages messages 10
          shoot 12b-sent-track sent-track 10
          shoot 12c-personal-track personal-track 10
          # The action-card anatomy, for the content brief (EN then FR).
          shoot 20-card-top card 10
          shoot 21-card-middle card-middle 10
          shoot 22-card-bottom card-bottom 10
          shoot 23-card-breath card-breath 10
          shoot 24-bank bank 10
          shootfr 20-card-top-fr card 10
          shootfr 21-card-middle-fr card-middle 10
          shootfr 22-card-bottom-fr card-bottom 10
          shootfr 23-card-breath-fr card-breath 10
          shootfr 24-bank-fr bank 10
          ls -la shots

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-screens
          path: |
            FunctionAlps/shots/*.png
            FunctionAlps/build/build.log
          if-no-files-found: warn
          retention-days: 14

  shoot-track:
    name: Shoot the Foundation Track
    if: (github.event_name == 'workflow_dispatch' && inputs.set == 'track') || contains(github.event.head_commit.message, '[track-screens]')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          printf 'DEVELOPMENT_TEAM = \n' > Config/Local.xcconfig
          xcodegen generate

      - name: Pick an iPhone Pro simulator
        id: sim
        run: |
          xcrun simctl list devices available | grep -i "iphone" | head -30
          LINE=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(|iPhone 17 Pro \(|iPhone 15 Pro \(" | head -1)
          UDID=$(echo "$LINE" | grep -oE '[0-9A-F-]{36}')
          NAME=$(echo "$LINE" | sed -E 's/^ *//; s/ \(.*//')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $NAME ($UDID)"

      - name: Build (Debug, simulator)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project FunctionAlps.xcodeproj -scheme FunctionAlps -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -skipMacroValidation \
            | tee build/build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build/build.log

      - name: Boot and dress the simulator
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$UDID" "$APP"

      - name: Shoot
        run: |
          export UDID=${{ steps.sim.outputs.udid }}
          export BUNDLE=com.functionalps.patient
          # The screens are "in the morning": pick the whole-hour zone where it is 9 o'clock now.
          H=$(date -u +%H); N=$(( (9 - 10#$H + 24) % 24 ))
          if [ "$N" -le 14 ]; then TZONE="Etc/GMT-$N"; else TZONE="Etc/GMT+$(( 24 - N ))"; fi
          export TZONE
          echo "Time zone for the app: $TZONE"
          Scripts/shoot_track.sh

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-track-screens
          path: |
            FunctionAlps/shots/track/*.png
            FunctionAlps/build/build.log
          if-no-files-found: warn
          retention-days: 14
